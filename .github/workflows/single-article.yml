name: Build Article Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package applications
        # Retain the existing release workflow policy of skipping tests.
        run: bash ./mvnw -B -ntp -DskipTests package
      - name: Build Docker images
        run: |
          for module in how_article; do
            docker build -t "registry.cn-beijing.aliyuncs.com/liushao-repository/${module}:latest" "${module}"
          done
      - name: Login to Aliyun
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER_NAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Push Docker images
        run: |
          for module in how_article; do
            docker push "registry.cn-beijing.aliyuncs.com/liushao-repository/${module}:latest"
          done
