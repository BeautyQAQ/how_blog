server:
  port: 9001
spring:
  application:
    name: how-article
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:how-blog}?characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    database: MySQL
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: none
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

feign:
  hystrix:
    enabled: true

jwt:
  config:
    key: ${JWT_SECRET}
    ttl: ${JWT_TTL:360000}
