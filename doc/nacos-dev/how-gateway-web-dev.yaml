server:
  port: 9005
spring:
  application:
    name: how-gateway-web
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: how-article
              uri: lb://how-article
              predicates:
                - Path=/article/**
              filters:
                - StripPrefix=1
            - id: how-user
              uri: lb://how-user
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            - id: how-search
              uri: lb://how-search
              predicates:
                - Path=/search/**
              filters:
                - StripPrefix=1

jwt:
  config:
    key: P1AXH29zhYz/U7v0Ft4jWjUs3myjsVBfd6SnhzoTNO4=
    ttl: 360000
