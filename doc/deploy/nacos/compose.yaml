name: nacos

services:
  nacos:
    # r-nacos latest stable on 2026-11-04; pin the published image digest.
    image: qingpan/rnacos:v0.8.8@sha256:09a81fcd2f72f029865d560c604deebd1b3c1da1b51af3c6cccdad83f5ae254a
    container_name: how-blog-nacos
    restart: unless-stopped
    mem_limit: 256m
    environment:
      RNACOS_DATA_DIR: /io/nacos_db
      RNACOS_HTTP_WORKERS: "2"
      RNACOS_HTTP_PORT: "8848"
      RNACOS_GRPC_PORT: "9848"
      RNACOS_HTTP_CONSOLE_PORT: "10848"
      RNACOS_INIT_ADMIN_USERNAME: ${NACOS_USERNAME:?Please set NACOS_USERNAME in .env}
      RNACOS_INIT_ADMIN_PASSWORD: ${NACOS_PASSWORD:?Please set NACOS_PASSWORD in .env}
      # v0.8.8 only serves the no-auth console when OpenAPI auth is also disabled.
      RNACOS_ENABLE_OPEN_API_AUTH: "false"
      RNACOS_ENABLE_NO_AUTH_CONSOLE: "true"
      RNACOS_CLUSTER_TOKEN: ${RNACOS_CLUSTER_TOKEN:?Please set RNACOS_CLUSTER_TOKEN in .env}
      RNACOS_GMT_OFFSET_HOURS: "8"
      RUST_LOG: warn
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    volumes:
      - ./data:/io/nacos_db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # The upstream image includes bash but no curl/wget.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8848; printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    networks:
      - how

networks:
  how:
    external: true
