spring.application.name=how-gateway-web
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}&refreshEnabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.username=${NACOS_USERNAME}
spring.cloud.nacos.config.password=${NACOS_PASSWORD}
spring.cloud.nacos.config.context-path=/nacos
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD}
spring.cloud.nacos.discovery.context-path=/nacos
springdoc.swagger-ui.urls[0].name=文章服务
springdoc.swagger-ui.urls[0].url=/article/v3/api-docs
springdoc.swagger-ui.urls[1].name=用户服务
springdoc.swagger-ui.urls[1].url=/user/v3/api-docs
springdoc.swagger-ui.urls[2].name=搜索服务
springdoc.swagger-ui.urls[2].url=/search/v3/api-docs
